# Dependabot configuration for safeguard-go.
#
# Ecosystems covered:
#   * gomod           -- Go module dependencies declared in go.mod.
#   * github-actions  -- workflow file dependencies (CodeQL, etc.).
#
# Major-version bumps are excluded; they require human review and a
# separate planning cycle (semantic-import versioning for Go means a
# major bump changes the module import path).
#
# GitHub Private Vulnerability Disclosure (PVD) should be enabled in
# the repository's Security tab; that toggle is not file-driven.
version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "security"
    groups:
      go-patch-and-minor:
        update-types:
          - "patch"
          - "minor"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
      # Hold the module's Go directive at the supported 1.21 floor. Newer
      # golang.org/x/crypto minors (e.g. 0.35.0) and coder/websocket patches
      # (1.8.14+) raise their own `go` directive to 1.23+, which `go mod tidy`
      # would propagate into our go.mod and break the 1.21 floor. The SDK only
      # uses x/crypto/pbkdf2 and x/crypto/scrypt (not the ssh package) and has
      # no open security advisories, so holding these is safe. Revisit these
      # pins if we intentionally raise the Go floor or a security advisory
      # requires a newer version.
      - dependency-name: "golang.org/x/crypto"
        update-types:
          - "version-update:semver-minor"
      - dependency-name: "github.com/coder/websocket"
        update-types:
          - "version-update:semver-patch"
          - "version-update:semver-minor"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ci"
    groups:
      actions-patch-and-minor:
        update-types:
          - "patch"
          - "minor"

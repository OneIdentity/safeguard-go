parameters:
  jobName: GoValidation
  displayName: 'Validate safeguard-go SDK'

jobs:
- job: ${{ parameters.jobName }}
  displayName: ${{ parameters.displayName }}
  pool:
    vmImage: ubuntu-latest
  steps:
  - template: go-setup-steps.yml

  - script: go build ./...
    displayName: 'Build'

  - script: |
      files=`gofmt -l .`
      if [ -n "$files" ]; then
        echo "gofmt required for:"
        echo "$files"
        exit 1
      fi
    displayName: 'Check gofmt'

  - script: go vet ./...
    displayName: 'Vet'

  - script: |
      set -euo pipefail
      GOLANGCI_LINT_VERSION=1.64.8
      # Download the prebuilt binary straight from the release asset rather than
      # piping install.sh, whose anonymous GitHub API version lookup is rate
      # limited (60/hour/IP) and fails intermittently on shared hosted agents.
      curl -sSfL "https://github.com/golangci/golangci-lint/releases/download/v${GOLANGCI_LINT_VERSION}/golangci-lint-${GOLANGCI_LINT_VERSION}-linux-amd64.tar.gz" -o /tmp/golangci-lint.tar.gz
      tar -xzf /tmp/golangci-lint.tar.gz -C /tmp
      "/tmp/golangci-lint-${GOLANGCI_LINT_VERSION}-linux-amd64/golangci-lint" run
    displayName: 'Lint with golangci-lint'

  - script: go test -race ./...
    displayName: 'Run race-enabled unit tests'
